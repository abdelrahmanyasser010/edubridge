          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/calendar/events/{event}:
    get:
      summary: Show calendar event
      operationId: dashboardCalendarEventsShow
      tags:
        - Calendar
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calendar event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    patch:
      summary: Update calendar event
      operationId: dashboardCalendarEventsUpdate
      tags:
        - Calendar
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calendar event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      summary: Cancel calendar event
      operationId: dashboardCalendarEventsCancel
      tags:
        - Calendar
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calendar event cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/assessments:
    get:
      summary: List dashboard assessments for approval
      operationId: dashboardAssessmentsList
      tags:
        - Assessment
      parameters:
