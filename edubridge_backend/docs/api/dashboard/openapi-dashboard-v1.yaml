              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password, device_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_id:
          type: string
        device_name:
          type: string
    LoginResponse:
      type: object
      required: [token, token_type]
      properties:
        token:
          type: string
        token_type:
          type: string
        expires_at:
          type: string
          nullable: true
        user:
          type: object
        school:
          type: object
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
        meta:
          type: object
          properties:
            request_id:
              type: string
  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            type: object
            required: [message, code, errors]
            properties:
              message:
                type: string
              code:
                type: string
              errors:
                type: object
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message:
                type: string
              code:
                type: string
