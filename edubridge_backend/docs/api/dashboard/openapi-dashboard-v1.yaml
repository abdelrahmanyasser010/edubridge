              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/admin-accounts/{account}/role:
    patch:
      summary: Update dashboard admin role
      operationId: dashboardAdminAccountsRoleUpdate
      tags:
        - RBAC
      parameters:
        - name: account
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/admin-accounts/{account}/status:
    patch:
