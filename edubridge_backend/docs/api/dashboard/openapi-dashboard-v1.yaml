openapi: 3.0.0
info:
  title: EduBridge Dashboard API
  version: 1.0.0
  description: API specifications for the EduBridge school management dashboard panel.
servers:
  - url: http://alpha.edubridge.test/api/v1
    description: Local development environment
  - url: https://{school_subdomain}.api.edubridge.com/api/v1
    description: Production API URL
    variables:
      school_subdomain:
        default: alpha
        description: Subdomain assigned to the tenant school
security:
  - BearerAuth: []
paths:
  /dashboard/auth/login:
    post:
      summary: Authenticate Dashboard User
      operationId: dashboardLogin
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '403':
          description: Access denied due to unauthorized role (e.g. not an admin)
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      summary: Terminate current session token
      operationId: logout
      tags:
        - Authentication
      responses:
        '204':
          description: Session terminated

  /auth/me:
    get:
      summary: Get active user session profile
      operationId: me
      tags:
        - Authentication
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/device-sessions:
    get:
      summary: List all active user sessions
      operationId: deviceSessions
      tags:
        - Authentication
      responses:
        '200':
          description: List of active device sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/device-sessions/{deviceSession}/revoke:
    post:
      summary: Revoke a specific device session
      operationId: revokeDeviceSession
      tags:
        - Authentication
      parameters:
        - name: deviceSession
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Device session revoked

  /auth/device/push-token:
    put:
      summary: Update device FCM token
      operationId: updatePushToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, web]
      responses:
        '204':
          description: FCM Token saved

  /school/lookup:
    post:
      summary: Onboard / Lookup school by invitation token
      operationId: schoolLookup
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: School resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /admin/dashboard/summary:
    get:
      summary: Get dashboard widget counts
      operationId: dashboardSummary
      tags:
        - Dashboard Overview
      responses:
        '200':
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /admin/search:
    get:
      summary: Global search across people
      operationId: adminSearch
      tags:
        - Dashboard Overview
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, teachers, parents, students]
            default: all
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /academic/structure:
    get:
      summary: Get complete academic structure
      operationId: academicStructure
      tags:
        - Academic
      responses:
        '200':
          description: Academic structure data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/audit-logs:
    get:
      summary: List tenant-scoped dashboard audit logs
      operationId: dashboardAuditLogsList
      tags:
        - Audit Logs
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/audit-logs/{auditLog}:
    get:
      summary: Show one tenant-scoped dashboard audit log
      operationId: dashboardAuditLogsShow
      tags:
        - Audit Logs
      parameters:
        - name: auditLog
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit log detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/rbac/roles:
    get:
      summary: List dashboard roles
      operationId: dashboardRbacRolesList
      tags:
        - RBAC
      responses:
        '200':
          description: RBAC roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      summary: Create custom role
      operationId: dashboardRbacRolesCreate
      tags:
        - RBAC
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/rbac/permissions:
    get:
      summary: List permission keys
      operationId: dashboardRbacPermissionsList
      tags:
        - RBAC
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /dashboard/rbac/matrix:
    get:
      summary: Get RBAC matrix
      operationId: dashboardRbacMatrixShow
      tags:
        - RBAC
      responses:
        '200':
          description: Matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    patch:
      summary: Update RBAC matrix
      operationId: dashboardRbacMatrixUpdate
      tags:
        - RBAC
      responses:
        '200':
          description: Matrix updated
