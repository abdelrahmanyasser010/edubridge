          in: query
          schema:
            type: string
            enum: [draft, pending_approval, published, locked]
        - name: academic_term_id
          in: query
          schema:
            type: string
        - name: teacher_id
          in: query
          schema:
            type: string
        - name: section_id
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
