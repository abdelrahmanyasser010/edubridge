openapi: 3.1.0
info:
  title: EduBridge Mobile API
  version: 1.0.0
  summary: Flutter integration contract for Parent, Teacher, Student and Transport apps
servers:
- url: http://alpha.edubridge.test:8000/api/v1
  description: Local tenant example
- url: https://{schoolSubdomain}.api.edubridge.com/api/v1
  description: Production tenant pattern
  variables:
    schoolSubdomain:
      default: alpha
security:
- bearerAuth: []
tags:
- name: Auth
- name: Shared
- name: Support
- name: Parent
- name: Payments
- name: Wallet
- name: Teacher
- name: Student
- name: Transport
paths:
  /school/lookup:
    post:
      tags:
      - Auth
      summary: Resolve a school from an invitation token
      operationId: schoolLookup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/auth/login:
    post:
      tags:
      - Auth
      summary: Parent app login
      operationId: parentAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teacher/auth/login:
    post:
      tags:
      - Auth
      summary: Teacher app login
      operationId: teacherAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /student/auth/login:
    post:
      tags:
      - Auth
      summary: Student app login
      operationId: studentAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /transport/auth/login:
    post:
      tags:
      - Auth
      summary: Transport app login
      operationId: transportAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Authenticated user/school/role/permissions/device context
      operationId: authMe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current token
      operationId: authLogout
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/device-sessions:
    get:
      tags:
      - Auth
      summary: List active device sessions
      operationId: authDeviceSessions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/device-sessions/{deviceSession}/revoke:
    post:
      tags:
      - Auth
      summary: Revoke a device session
      operationId: authRevokeDeviceSessionPost
      parameters:
      - name: deviceSession
        in: path
        required: true
        description: deviceSession
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - Auth
      summary: Revoke a device session
      operationId: authRevokeDeviceSessionDelete
      parameters:
      - name: deviceSession
        in: path
        required: true
        description: deviceSession
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/device/push-token:
    put:
      tags:
      - Auth
      summary: Update FCM/APNs device push token
      operationId: authUpdatePushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - platform
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications:
    get:
      tags:
      - Shared
      summary: List notifications
      operationId: notificationsIndex
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications/{delivery}/read:
    post:
      tags:
      - Shared
      summary: Mark one notification as read
      operationId: notificationRead
      parameters:
      - name: delivery
        in: path
        required: true
        description: delivery
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications/read-all:
    post:
      tags:
      - Shared
      summary: Mark all notifications as read
      operationId: notificationsReadAll
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notification-preferences:
    get:
      tags:
      - Shared
      summary: Get notification preferences
      operationId: notificationPreferencesGet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
      - Shared
      summary: Update notification preference
      operationId: notificationPreferencesUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations:
    get:
      tags:
      - Shared
      summary: List conversations
      operationId: conversationsIndex
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Shared
      summary: Create conversation
      operationId: conversationsStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations/{thread}/messages:
    get:
      tags:
      - Shared
      summary: List conversation messages
      operationId: conversationMessages
      parameters:
      - name: thread
        in: path
        required: true
        description: thread
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Shared
      summary: Send conversation message (alias)
      operationId: conversationSendAlias
      parameters:
      - name: thread
        in: path
        required: true
        description: thread
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations/{thread}/send:
    post:
      tags:
      - Shared
      summary: Send conversation message
      operationId: conversationSend
      parameters:
      - name: thread
        in: path
        required: true
        description: thread
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations/{thread}/read:
    post:
      tags:
      - Shared
      summary: Mark conversation read
      operationId: conversationRead
      parameters:
      - name: thread
        in: path
        required: true
        description: thread
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /support/categories:
    get:
      tags:
      - Support
      summary: List support categories
      operationId: supportCategories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /support/tickets:
    get:
      tags:
      - Support
      summary: List current user support tickets
      operationId: supportTickets
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Support
      summary: Open support ticket
      operationId: supportTicketCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /support/tickets/{ticket}:
    get:
      tags:
      - Support
      summary: Get owned support ticket
      operationId: supportTicketShow
      parameters:
      - name: ticket
        in: path
        required: true
        description: ticket
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /support/tickets/{ticket}/messages:
    post:
      tags:
      - Support
      summary: Reply to owned support ticket
      operationId: supportTicketReply
      parameters:
      - name: ticket
        in: path
        required: true
        description: ticket
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students:
    get:
      tags:
      - Parent
      summary: List children linked to authenticated parent
      operationId: parentStudents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/profile:
    get:
      tags:
      - Parent
      summary: Get parent profile
      operationId: parentProfile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
      - Parent
      summary: Update allowed parent profile fields
      operationId: parentProfileUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 120
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/overview:
    get:
      tags:
      - Parent
      summary: Aggregated parent home overview for a child
      operationId: parentStudentOverview
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/attendance:
    get:
      tags:
      - Parent
      summary: Student attendance summary/history
      operationId: parentStudentAttendance
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/medical-excuses:
    post:
      tags:
      - Parent
      summary: Create medical excuse for linked student
      operationId: parentMedicalExcuseCreate
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/assignments:
    get:
      tags:
      - Parent
      summary: List assignments for linked student
      operationId: parentAssignments
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/assignments/{assignment}/submissions:
    post:
      tags:
      - Parent
      summary: Submit assignment for linked student
      operationId: parentAssignmentSubmit
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      - name: assignment
        in: path
        required: true
        description: assignment
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/assignments/{assignment}/attachments/{file}/download:
    get:
      tags:
      - Parent
      summary: Download authorized assignment attachment
      operationId: parentAssignmentAttachment
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      - name: assignment
        in: path
        required: true
        description: assignment
        schema:
          type: integer
          minimum: 1
      - name: file
        in: path
        required: true
        description: file
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/behavior-notes:
    get:
      tags:
      - Parent
      summary: List published behavior notes
      operationId: parentBehaviorNotes
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/behavior-notes/{note}/acknowledge:
    post:
      tags:
      - Parent
      summary: Acknowledge behavior note
      operationId: parentBehaviorAcknowledge
      parameters:
      - name: note
        in: path
        required: true
        description: note
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /parent/students/{student}/leave-permits:
    post:
      tags:
      - Parent
      summary: Create leave permit request
      operationId: parentLeavePermitCreate
      parameters:
      - name: student
        in: path
        required: true
        description: student
        schema:
          type: integer
