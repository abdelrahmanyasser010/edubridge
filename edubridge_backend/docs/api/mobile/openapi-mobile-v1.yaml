components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  responses:
    Unauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data: {}
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
    ErrorEnvelope:
      type: object
      required:
      - message
      - code
      - errors
      - meta
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - device_id
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_id:
          type: string
          maxLength: 128
          description: Stable installation UUID
        device_name:
          type:
          - string
          - 'null'
          maxLength: 128
    SupportTicketCreate:
      type: object
      required:
      - category_key
      - subject
      - message
      properties:
        category_key:
          type: string
          enum:
          - general
          - technical
          - academic
          - attendance
          - transport
          - finance
        subject:
          type: string
          maxLength: 180
        message:
          type: string
          maxLength: 5000
    InvoicePaymentSessionCreate:
      type: object
      required:
      - method
      - idempotency_key
      properties:
        method:
          type: string
          enum:
          - mada
          - apple_pay
          - visa
          - mastercard
          - stc_pay
          - samsung_pay
        idempotency_key:
          type: string
          format: uuid
      description: Method must also be enabled by server configuration. Amount is derived from invoice.
    WalletTopUpSessionCreate:
      type: object
      required:
      - amount_minor
      - payment_method
      - idempotency_key
      properties:
        amount_minor:
          type: integer
          minimum: 1
        payment_method:
          type: string
          enum:
          - mada
          - apple_pay
          - visa
          - mastercard
          - stc_pay
          - samsung_pay
        idempotency_key:
          type: string
          format: uuid
