components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: School-scoped Laravel Sanctum bearer token issued per device.
  parameters:
    DeviceSessionId:
      name: deviceSession
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    FilePublicId:
      name: publicId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    Signature:
      name: signature
      in: query
      required: true
      schema:
        type: string
    Expires:
      name: expires
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    AcademicYearId:
      name: academicYear
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    AcademicTermId:
      name: academicTerm
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    GradeLevelId:
      name: gradeLevel
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    SubjectId:
      name: subject
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    SectionId:
      name: section
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    TeacherId:
      name: teacher
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    ParentId:
      name: parent
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    StudentId:
      name: student
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    StudentParentId:
      name: studentParent
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    AllocationId:
      name: allocation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
    ScheduleSlotId:
      name: slot
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StringId'
  responses:
    Unauthenticated:
      description: Missing, invalid, expired, or revoked authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated user is not allowed to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource does not exist or is hidden by policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Current resource state conflicts with the requested action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the client may retry when available
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    StringId:
      type: string
      minLength: 1
      description: IDs are serialized as strings to avoid client integer precision loss.
    Timestamp:
      type: string
      format: date-time
      examples:
      - '2026-07-12T18:30:00Z'
    RequestMeta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$|^[A-Za-z0-9._:-]{1,128}$
    PaginationLinks:
      type: object
      required:
      - next
      - prev
      properties:
        next:
          type:
          - string
          - 'null'
          format: uri-reference
        prev:
          type:
          - string
          - 'null'
          format: uri-reference
    PaginationMeta:
      allOf:
      - $ref: '#/components/schemas/RequestMeta'
      - type: object
        properties:
          per_page:
            type: integer
            minimum: 1
            maximum: 100
          next_cursor:
            type:
            - string
            - 'null'
          prev_cursor:
            type:
            - string
            - 'null'
          current_page:
            type: integer
            minimum: 1
          last_page:
            type: integer
            minimum: 1
          total:
            type: integer
            minimum: 0
    SuccessEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data: true
        meta:
          $ref: '#/components/schemas/RequestMeta'
    CollectionEnvelope:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          items: true
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorEnvelope:
      type: object
      required:
      - message
      - code
      - meta
      properties:
        message:
          type: string
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - VALIDATION_FAILED
          - RATE_LIMITED
          - HTTP_ERROR
          - SERVER_ERROR
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - device_id
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_id:
          type: string
          maxLength: 128
          description: Stable app-installation UUID generated by the client.
        device_name:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Human-readable device/app name.
    LoginResponse:
      allOf:
      - $ref: '#/components/schemas/AuthContext'
      - type: object
        required:
        - token
        - token_type
        properties:
          token:
            type: string
          token_type:
            type: string
            const: Bearer
          expires_at:
            type:
            - string
            - 'null'
            format: date-time
    AuthContext:
      type: object
      required:
      - user
      - school
      - device_session
      properties:
        user:
          $ref: '#/components/schemas/User'
        school:
          $ref: '#/components/schemas/School'
        device_session:
          $ref: '#/components/schemas/DeviceSession'
    User:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        name:
          type: string
        email:
          type: string
          format: email
    School:
      type: object
      required:
      - id
      - code
      - name
      - timezone
      - locale
      - currency
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
          enum:
          - ar
          - en
        currency:
          type: string
          minLength: 3
          maxLength: 3
    ParentSummonsCreateInput:
      type: object
      required:
      - student_id
      - parent_id
      - scheduled_at
      - reason
      properties:
        student_id:
          $ref: '#/components/schemas/StringId'
        parent_id:
          $ref: '#/components/schemas/StringId'
        scheduled_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 255
    ParentSummonsResponseInput:
      type: object
      required:
      - response
      properties:
        response:
          type: string
          enum:
          - accepted
          - declined
        response_note:
          type:
          - string
          - 'null'
          maxLength: 1000
    ParentSummons:
      type: object
      required:
      - id
      - student_id
      - parent_id
      - scheduled_at
      - reason
      - status
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        student_id:
          $ref: '#/components/schemas/StringId'
        parent_id:
          $ref: '#/components/schemas/StringId'
        scheduled_at:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum:
          - pending
          - responded
          - cancelled
        response:
          type:
          - string
          - 'null'
          enum:
          - accepted
          - declined
          - null
        response_note:
          type:
          - string
          - 'null'
        responded_at:
          type:
          - string
          - 'null'
          format: date-time
    TeacherSubstitutionCreateInput:
      type: object
      required:
      - teaching_session_id
      - substitute_teacher_id
      properties:
        teaching_session_id:
          $ref: '#/components/schemas/StringId'
        substitute_teacher_id:
          $ref: '#/components/schemas/StringId'
        reason:
          type:
          - string
          - 'null'
          maxLength: 255
    TeacherSubstitution:
      type: object
      required:
      - id
      - teaching_session_id
      - original_teacher_id
      - substitute_teacher_id
      - status
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        teaching_session_id:
          $ref: '#/components/schemas/StringId'
        original_teacher_id:
          $ref: '#/components/schemas/StringId'
        substitute_teacher_id:
          $ref: '#/components/schemas/StringId'
        reason:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - cancelled
        response_note:
          type:
          - string
          - 'null'
        responded_at:
          type:
          - string
          - 'null'
          format: date-time
    AssessmentCreateInput:
      type: object
      required:
      - allocation_id
      - title
      - type
      - max_score
      properties:
        allocation_id:
          $ref: '#/components/schemas/StringId'
        title:
          type: string
          maxLength: 180
        type:
          type: string
          enum:
          - quiz
          - exam
          - assignment
          - project
          - participation
        max_score:
          type: number
          minimum: 0
        weight:
          type: number
          minimum: 0
    Assessment:
      type: object
      required:
      - id
      - academic_term_id
      - allocation_id
      - title
      - type
      - max_score
      - weight
      - status
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        academic_term_id:
          $ref: '#/components/schemas/StringId'
        allocation_id:
          $ref: '#/components/schemas/StringId'
        title:
          type: string
        type:
          type: string
        max_score:
          type: string
        weight:
          type: string
        status:
          type: string
          enum:
          - draft
          - pending_approval
          - published
          - locked
    GradeEntryBulkInput:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - student_id
            properties:
              student_id:
                $ref: '#/components/schemas/StringId'
              score:
                type:
                - number
                - 'null'
                minimum: 0
              feedback:
                type:
                - string
                - 'null'
                maxLength: 1000
              revision:
                type:
                - integer
                - 'null'
                minimum: 1
    GradeEntry:
      type: object
      required:
      - id
      - assessment_id
      - student_id
      - entered_by_teacher_id
      - revision
      properties:
        id:
          $ref: '#/components/schemas/StringId'
        assessment_id:
          $ref: '#/components/schemas/StringId'
        student_id:
          $ref: '#/components/schemas/StringId'
        score:
          type:
          - string
          - 'null'
        feedback:
          type:
          - string
          - 'null'
        entered_by_teacher_id:
          $ref: '#/components/schemas/StringId'
        revision:
          type: integer
    AcademicStructure:
      type: object
      required:
      - academic_years
      - grade_levels
      - subjects
      properties:
        academic_years:
          type: array
          items:
