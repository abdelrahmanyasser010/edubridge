openapi: 3.1.0
info:
  title: EduBridge Backend API
  version: 0.1.0
  summary: Multi-school EduBridge API contract skeleton
  description: 'Source of truth for API paths, shared envelopes, authentication, errors, and pagination. Domain endpoints
    are added by their own tasks.

    '
servers:
- url: /api/v1
  description: Versioned API base path
tags:
- name: Auth
  description: First-party Sanctum authentication and device sessions
- name: Academic
  description: Academic years, terms, grade levels, sections, and subjects
- name: People
  description: Teacher, guardian, and student profiles
- name: Attendance
  description: Attendance roster, drafts, and submissions
- name: Assignments
  description: Teacher assignment drafting and publishing
- name: Notifications
  description: Notification inbox, read receipts, and preferences
- name: Behavior
  description: Behavior note workflow and parent acknowledgement
- name: Messaging
  description: Authorized conversation threads and messages
- name: Operations
  description: Student affairs operational workflows
- name: Finance
  description: Dashboard billing, invoices, payments, discounts, and reports
- name: Files
  description: Private file download after tenant authorization
- name: Foundation
  description: Shared API conventions and health-style testing routes
security:
- bearerAuth: []
paths:
  /dashboard/auth/login:
    post:
      tags:
      - Auth
      operationId: dashboardAuthLogin
      summary: Issue a school-scoped Sanctum token for Dashboard App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /teacher/auth/login:
    post:
      tags:
      - Auth
      operationId: teacherAuthLogin
      summary: Issue a school-scoped Sanctum token for Teacher App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /parent/auth/login:
    post:
      tags:
      - Auth
      operationId: parentAuthLogin
      summary: Issue a school-scoped Sanctum token for Parent App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /student/auth/login:
    post:
      tags:
      - Auth
      operationId: studentAuthLogin
      summary: Issue a school-scoped Sanctum token for Student App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /transport/auth/login:
    post:
      tags:
      - Auth
      operationId: transportAuthLogin
      summary: Issue a school-scoped Sanctum token for Transport App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /school/lookup:
    post:
      tags:
      - Auth
      operationId: schoolLookup
      summary: Resolve school metadata and api_base_url by invitation token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: School resolved successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - school_name
                      - school_code
                      - api_base_url
                      properties:
                        school_name:
                          type: string
                        school_code:
                          type: string
                        api_base_url:
                          type: string
        '422':
          description: Invalid or expired token
  /auth/device/push-token:
    put:
      tags:
      - Auth
      operationId: updatePushToken
      summary: Store or update device FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - platform
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
      responses:
        '204':
          description: Push token stored successfully
  /auth/me:
    get:
      tags:
      - Auth
      operationId: authMe
      summary: Return the authenticated user, school, and current device session
      responses:
        '200':
          description: Current authenticated identity
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/device-sessions:
    get:
      tags:
      - Auth
      operationId: authDeviceSessions
      summary: List active device sessions for the authenticated user
      responses:
        '200':
          description: Active device sessions
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CollectionEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeviceSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: authLogout
      summary: Revoke the current device token
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/device-sessions/{deviceSession}/revoke:
    post:
      tags:
      - Auth
      operationId: authRevokeDeviceSessionPost
      summary: Alias for revoking another active device session
      parameters:
      - $ref: '#/components/parameters/DeviceSessionId'
      responses:
        '204':
          description: Device session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Auth
      operationId: authRevokeDeviceSession
      summary: Revoke another active device session owned by the authenticated user
      parameters:
      - $ref: '#/components/parameters/DeviceSessionId'
      responses:
        '204':
          description: Device session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{publicId}/download:
    get:
      tags:
      - Files
      operationId: filesDownload
      summary: Stream a private file using a short-lived signed URL
      description: Requires a valid Sanctum token, tenant context, URL signature, file ownership, and clean scan status.
      parameters:
      - $ref: '#/components/parameters/FilePublicId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Expires'
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /academic/structure:
    get:
      tags:
      - Academic
      operationId: academicStructure
      summary: Return tenant academic years, terms, grade levels, sections, and subjects
      responses:
        '200':
          description: Academic structure aggregate
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AcademicStructure'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /academic-years:
    post:
      tags:
      - Academic
      operationId: academicYearsCreate
      summary: Create an academic year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearInput'
      responses:
        '201':
          description: Academic year created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AcademicYear'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic-years/{academicYear}:
    patch:
      tags:
      - Academic
      operationId: academicYearsUpdate
      summary: Update an academic year
      parameters:
      - $ref: '#/components/parameters/AcademicYearId'
      responses:
        '200':
          description: Academic year updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Academic
      operationId: academicYearsClose
      summary: Close an academic year instead of hard-deleting it
      parameters:
      - $ref: '#/components/parameters/AcademicYearId'
      responses:
        '200':
          description: Academic year closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /academic-years/{academicYear}/terms:
    post:
      tags:
      - Academic
      operationId: academicTermsCreate
      summary: Create a term inside an academic year
      parameters:
      - $ref: '#/components/parameters/AcademicYearId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermInput'
      responses:
        '201':
          description: Academic term created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic-terms/{academicTerm}/activate:
    post:
      tags:
      - Academic
      operationId: academicTermsActivate
      summary: Activate a term; only one active term is allowed per year
      parameters:
      - $ref: '#/components/parameters/AcademicTermId'
      responses:
        '200':
          description: Academic term activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /academic-terms/{academicTerm}:
    patch:
      tags:
      - Academic
      operationId: academicTermsUpdate
      summary: Update an academic term
      parameters:
      - $ref: '#/components/parameters/AcademicTermId'
      responses:
        '200':
          description: Academic term updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /grade-levels:
    post:
      tags:
      - Academic
      operationId: gradeLevelsCreate
      summary: Create a grade level
      responses:
        '201':
          description: Grade level created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /grade-levels/{gradeLevel}:
    patch:
      tags:
      - Academic
      operationId: gradeLevelsUpdate
      summary: Update a grade level
      parameters:
      - $ref: '#/components/parameters/GradeLevelId'
      responses:
        '200':
          description: Grade level updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - Academic
      operationId: gradeLevelsArchive
      summary: Archive a grade level
      parameters:
      - $ref: '#/components/parameters/GradeLevelId'
      responses:
        '200':
          description: Grade level archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /subjects:
    post:
      tags:
      - Academic
      operationId: subjectsCreate
      summary: Create a subject and optionally assign it to grade levels
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /subjects/{subject}:
    patch:
      tags:
      - Academic
      operationId: subjectsUpdate
      summary: Update a subject
      parameters:
      - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Subject updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - Academic
      operationId: subjectsArchive
      summary: Archive a subject
      parameters:
      - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Subject archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /sections:
    post:
      tags:
      - Academic
      operationId: sectionsCreate
      summary: Create a section under a grade level
      responses:
        '201':
          description: Section created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /sections/{section}:
    patch:
      tags:
      - Academic
      operationId: sectionsUpdate
      summary: Update a section
      parameters:
      - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: Section updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - Academic
      operationId: sectionsArchive
      summary: Archive a section
      parameters:
      - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: Section archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /teachers:
    get:
      tags:
      - People
      operationId: teachersList
      summary: List teacher profiles
      responses:
        '200':
          description: Teacher profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
      - People
      operationId: teachersCreate
      summary: Create a teacher profile
      responses:
        '201':
          description: Teacher profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /teachers/{teacher}:
    get:
      tags:
      - People
      operationId: teachersShow
      summary: Show a teacher profile with dashboard-friendly assignment summaries
      parameters:
      - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - People
      operationId: teachersUpdate
      summary: Update a teacher profile
      parameters:
      - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: Teacher profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - People
      operationId: teachersArchive
      summary: Archive a teacher profile instead of hard-deleting it
      parameters:
      - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: Teacher profile archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /parents:
    get:
      tags:
      - People
      operationId: parentsList
      summary: List guardian profiles
      responses:
        '200':
          description: Guardian profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
      - People
      operationId: parentsCreate
      summary: Create a guardian profile
      responses:
        '201':
          description: Guardian profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /parents/{parent}:
    get:
      tags:
      - People
      operationId: parentsShow
      summary: Show a guardian profile with children summary
      parameters:
      - $ref: '#/components/parameters/ParentId'
      responses:
        '200':
          description: Guardian profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - People
      operationId: parentsUpdate
      summary: Update a guardian profile
      parameters:
      - $ref: '#/components/parameters/ParentId'
      responses:
        '200':
          description: Guardian profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - People
      operationId: parentsArchive
      summary: Archive a guardian profile instead of hard-deleting it
      parameters:
      - $ref: '#/components/parameters/ParentId'
      responses:
        '200':
          description: Guardian profile archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /students:
    get:
      tags:
      - People
      operationId: studentsList
      summary: List student profiles
      responses:
        '200':
          description: Student profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
      - People
      operationId: studentsCreate
      summary: Create a student profile
      responses:
        '201':
          description: Student profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /students/{student}:
    get:
      tags:
      - People
      operationId: studentsShow
      summary: Show a student profile with guardian summary
      parameters:
      - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - People
      operationId: studentsUpdate
      summary: Update a student profile
      parameters:
      - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - People
      operationId: studentsArchive
      summary: Archive a student profile instead of hard-deleting it
      parameters:
      - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student profile archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /students/{student}/parents:
    get:
      tags:
      - People
      operationId: studentParentsList
      summary: List guardian links for a student
      parameters:
      - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student guardian links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
      - People
      operationId: studentParentsCreate
      summary: Attach a guardian to a student
      parameters:
      - $ref: '#/components/parameters/StudentId'
      responses:
        '201':
          description: Student guardian link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/{student}/parents/{studentParent}:
    patch:
      tags:
      - People
      operationId: studentParentsNestedUpdate
      summary: Update a student guardian relationship using dashboard nested route
      parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/StudentParentId'
      responses:
        '200':
          description: Student guardian link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - People
      operationId: studentParentsNestedArchive
      summary: Archive a student guardian relationship using dashboard nested route
      parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/StudentParentId'
      responses:
        '200':
          description: Student guardian link archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /student-parents/{studentParent}:
    patch:
      tags:
      - People
      operationId: studentParentsUpdate
      summary: Update a student guardian relationship
      parameters:
      - $ref: '#/components/parameters/StudentParentId'
      responses:
        '200':
          description: Student guardian link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - People
      operationId: studentParentsArchive
      summary: Archive a student guardian relationship
      parameters:
      - $ref: '#/components/parameters/StudentParentId'
      responses:
        '200':
          description: Student guardian link archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /academic/allocations:
    get:
      tags:
      - Academic
      operationId: academicAllocationsList
      summary: List teacher-section-subject allocations
      responses:
        '200':
          description: Teacher-section-subject allocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags:
      - Academic
      operationId: academicAllocationsCreate
      summary: Allocate a teacher to a subject in a section for a term
      responses:
        '201':
          description: Allocation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic/allocations/{allocation}:
    patch:
      tags:
      - Academic
      operationId: academicAllocationsUpdate
      summary: Update an allocation quota or homeroom flag
      parameters:
      - $ref: '#/components/parameters/AllocationId'
      responses:
        '200':
          description: Allocation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags:
      - Academic
      operationId: academicAllocationsArchive
      summary: Archive an allocation
      parameters:
      - $ref: '#/components/parameters/AllocationId'
      responses:
        '200':
          description: Allocation archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /schedule-slots:
    get:
      tags:
      - Academic
      operationId: scheduleSlotsList
      summary: List schedule slots
      responses:
        '200':
          description: Schedule slots
          content:
            application/json:
              schema:
